<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Minko, le plan complet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<style>
/* Une page de travail aux couleurs de Mel : bandeau prune, contenu blanc, un seul thème choisi. */
:root{--plum:#532943;--plumd:#2C1020;--pink:#EB6BAF;--green:#77BC1F;--ink:#2C1020;--ink2:#6b5a64;--line:#eadfe5;--soft:#faf5f8;--bg:#fff;--font:'Montserrat',-apple-system,'Helvetica Neue',Arial,sans-serif}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;font-weight:500}
.w{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--plum);color:#fff;padding-block:44px 40px}
header h1{font-size:clamp(34px,6vw,56px);font-weight:900;line-height:1.05;letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
header h1 span{color:var(--pink)}
header p{margin:0;max-width:64ch;color:#f2e6ec}
nav{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-weight:700;font-size:14px}
nav a{color:#fff}
section{padding-block:38px 6px}
h2{font-size:28px;font-weight:900;letter-spacing:-.015em;margin:0 0 14px;color:var(--plum);text-wrap:balance}
h3{font-size:18px;font-weight:800;margin:24px 0 6px;color:var(--plum)}
p{margin:0 0 12px;max-width:72ch}
ul,ol{margin:0 0 14px;padding-left:22px;max-width:72ch}li{margin-bottom:6px}
.note{color:var(--ink2);font-size:14px}
.alerte{background:var(--soft);border-left:6px solid var(--pink);padding:16px 20px;margin:0 0 14px}
.alerte p:last-child{margin:0}
.t{overflow-x:auto;margin:0 0 16px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:15px}
th{font-weight:800;text-align:left;color:var(--plum);border-bottom:2px solid var(--plum);padding:8px 10px 8px 0;vertical-align:bottom}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.filtres{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.f{font:700 14px var(--font);border:2px solid var(--plum);background:#fff;color:var(--plum);border-radius:999px;padding:7px 14px;cursor:pointer}
.f.on{background:var(--plum);color:#fff}.f:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px 16px}
figure{margin:0;min-width:0}figure img{display:block;width:100%;aspect-ratio:4/5;border:1px solid var(--line)}
figcaption{font-size:13px;line-height:1.4;color:var(--ink2);margin-top:7px}
figcaption b{color:var(--plum)}
.u{font-weight:800;color:var(--plum)}.u-payant{color:#4f8a0c}.u-attendre{color:#c2357f}
.e{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 18px;padding:14px 0;border-top:1px solid var(--line)}
.e b{color:var(--plum);font-weight:800}.e div p:last-child{margin:0}
@media (max-width:620px){.e{grid-template-columns:1fr}}
footer{padding-block:34px 44px;color:var(--ink2);font-size:14px}
</style>
<style>body{margin:0}#porte{min-height:100vh;display:grid;place-items:center;background:var(--plum);color:#fff;padding:16px}#porte form{max-width:360px;width:100%}#porte h1{font-size:28px;font-weight:900;margin:0 0 8px}#porte p{color:#f2e6ec;margin:0 0 16px}#porte input{width:100%;box-sizing:border-box;font:600 17px var(--font);padding:12px 14px;border-radius:12px;border:0;margin-bottom:10px}#porte button{width:100%;font:800 16px var(--font);padding:12px;border-radius:999px;border:0;background:var(--pink);color:#fff;cursor:pointer}#err{color:#ffd0e6;min-height:22px;margin-top:8px;font-weight:700}</style></head><body>
<div id="porte"><form id="f"><h1>Minko, le plan complet</h1><p>Budget, plan, critiques et règles. Le mot de passe est donné par David.</p>
<input id="m" type="password" autocomplete="current-password" placeholder="Mot de passe" aria-label="Mot de passe" autofocus><button>Ouvrir</button><div id="err" role="status"></div></form></div>
